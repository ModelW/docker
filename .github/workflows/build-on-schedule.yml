name: Build on schedule

on:
    schedule:
        - cron: "42 */3 * * *"
    workflow_dispatch:
        inputs:
            skip_check:
                description: 'Skip checks during build'
                required: false
                default: true
                type: boolean

jobs:
    sentry-start:
        runs-on: ubuntu-latest
        steps:
            - name: Send Sentry in_progress
              env:
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                  if [ -z "$SENTRY_DSN" ]; then
                      echo "SENTRY_DSN is not set. Skipping Sentry check-in."
                      exit 0
                  fi
                  if [[ $SENTRY_DSN =~ https://([^@]+)@([^/]+)/(.+) ]]; then
                      KEY="${BASH_REMATCH[1]}"
                      HOST="${BASH_REMATCH[2]}"
                      ID="${BASH_REMATCH[3]}"
                      SENTRY_CRONS="https://$HOST/api/$ID/cron/build-on-schedule/$KEY/"

                      echo "Sending 'in_progress' check-in to Sentry for 'build-on-schedule'..."
                      echo "Target: https://******/api/$ID/cron/build-on-schedule/****/"

                      curl -X POST "${SENTRY_CRONS}" \
                          -s -S \
                          --header 'Content-Type: application/json' \
                          --data-raw '{
                            "monitor_config": {
                              "schedule": {"type": "crontab", "value": "42 */3 * * *"},
                              "checkin_margin": 180,
                              "max_runtime": 60,
                              "timezone": "UTC",
                              "failure_issue_threshold": 1,
                              "recovery_threshold": 1
                            },
                            "status": "in_progress"
                          }'
                  else
                      echo "Could not parse SENTRY_DSN format."
                      exit 1
                  fi

    call-build-image:
        needs: sentry-start
        uses: ./.github/workflows/build-image.yml
        strategy:
            max-parallel: 1
            matrix:
                ref:
                    [
                        "support/2025.07",
                        "support/2025.10",
                        "support/2026.01",
                        "support/2026.04",
                    ]
        with:
            ref: ${{ matrix.ref }}
            skip_check: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_check == 'true' || github.event.inputs.skip_check == true) }}
        secrets: inherit

    sentry-end:
        needs: [sentry-start, call-build-image]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Send Sentry Result
              env:
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                  if [ -z "$SENTRY_DSN" ]; then
                      echo "SENTRY_DSN is not set. Skipping Sentry check-in."
                      exit 0
                  fi
                  if [[ $SENTRY_DSN =~ https://([^@]+)@([^/]+)/(.+) ]]; then
                      KEY="${BASH_REMATCH[1]}"
                      HOST="${BASH_REMATCH[2]}"
                      ID="${BASH_REMATCH[3]}"
                      SENTRY_CRONS="https://$HOST/api/$ID/cron/build-on-schedule/$KEY/"

                      STATUS="ok"
                      if [ "${{ needs.call-build-image.result }}" != "success" ]; then
                          STATUS="error"
                      fi

                      echo "Workflow finished with result: ${{ needs.call-build-image.result }}"
                      echo "Reporting status '$STATUS' to Sentry..."

                      curl -s -S "${SENTRY_CRONS}?status=${STATUS}"
                  else
                      echo "Could not parse SENTRY_DSN format."
                      exit 1
                  fi
