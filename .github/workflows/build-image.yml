name: Build Docker Image

on:
    workflow_call:
        inputs:
            ref:
                required: true
                type: string
            skip_check:
                required: false
                type: boolean
                default: false
jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - name: Extract branch name
              shell: bash
              env:
                  MODELW_REF: ${{ inputs.ref }}
              run: |
                  echo "DOCKER_TAG=$(echo ${MODELW_REF#refs/heads/} | sed -E 's/^support\///' | sed 's/^master$/latest/')" >> $GITHUB_ENV
              id: extract_branch

            - name: Print debug info
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                  DOCKER_TAG: ${{ env.DOCKER_TAG }}
              run: |
                  echo DOCKER_TAG=$DOCKER_TAG
                  echo DOCKER_USERNAME=$DOCKER_USERNAME

            # Check if the Docker image already exists
            - name: Check if Docker image exists
              if: inputs.skip_check == false
              id: check_docker_image
              shell: bash
              env:
                  DOCKER_TAG: ${{ env.DOCKER_TAG }}
              run: |
                  IMAGE=modelw/base
                  TAG=${DOCKER_TAG}
                  STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG")
                  if [ "$STATUS" -eq 200 ]; then
                    echo "IMAGE_EXISTS=true" >> $GITHUB_ENV
                    echo "Image exists"
                  else
                    echo "IMAGE_EXISTS=false" >> $GITHUB_ENV
                    echo "Image does not exist"
                  fi

            # Check for available package updates if the image exists
            - name: Check for apt updates in image
              if: inputs.skip_check == false && env.IMAGE_EXISTS == 'true'
              id: check_apt_updates
              run: |
                  UPDATES=$(docker run --rm modelw/base:${{ env.DOCKER_TAG }} sh -c 'sudo apt-get update -qq && sudo apt-get --just-print upgrade | grep "Inst " || true')
                  if [[ -n "$UPDATES" ]]; then
                    echo "APT_UPDATES_AVAILABLE=true" >> $GITHUB_ENV
                    echo "Updates are available"
                  else
                    echo "APT_UPDATES_AVAILABLE=false" >> $GITHUB_ENV
                    echo "No updates available"
                  fi

            # Get the installed Python version in the image
            - name: Get Python version in image
              if: inputs.skip_check == false && env.IMAGE_EXISTS == 'true'
              run: |
                  INSTALLED_VERSION=$(docker run --rm modelw/base:${{ env.DOCKER_TAG }} python3 --version | cut -d ' ' -f 2)
                  echo "INSTALLED_PYTHON_VERSION=$INSTALLED_VERSION" >> $GITHUB_ENV

            # Check if a newer Python patch version is available
            - name: Check for latest Python patch version
              if: inputs.skip_check == false && env.IMAGE_EXISTS == 'true'
              run: |
                  INSTALLED_VERSION=${{ env.INSTALLED_PYTHON_VERSION }}
                  MINOR_VERSION=$(echo "$INSTALLED_VERSION" | cut -d. -f1,2)

                  # Run uv python list in the Docker container
                  UV_OUTPUT=$(docker run --rm modelw/base:${{ env.DOCKER_TAG }} sh -c "uv python list 'cpython@$MINOR_VERSION' 2>/dev/null || true")

                  # Check if the first line contains "download available"
                  FIRST_LINE=$(echo "$UV_OUTPUT" | head -n1)
                  echo "First line of uv output: $FIRST_LINE"

                  if echo "$FIRST_LINE" | grep -q "<download available>"; then
                    echo "PYTHON_UPDATE_AVAILABLE=true" >> $GITHUB_ENV
                    echo "Python update available"
                  else
                    echo "PYTHON_UPDATE_AVAILABLE=false" >> $GITHUB_ENV
                    echo "Python is up to date"
                  fi

            # Check for available pnpm updates if the image exists
            - name: Check for pnpm updates in image
              if: inputs.skip_check == false && env.IMAGE_EXISTS == 'true'
              run: |
                  # We check for global packages updates
                  # We use || true because pnpm outdated returns exit code 1 if there are outdated packages
                  # We run as root to use the global configuration set during build
                  UPDATES=$(docker run --rm --user root modelw/base:${{ env.DOCKER_TAG }} pnpm outdated -g --format json 2>/dev/null || true)
                  if [[ -n "$UPDATES" ]] && echo "$UPDATES" | jq -e 'length > 0' >/dev/null 2>&1; then
                    echo "PNPM_UPDATES_AVAILABLE=true" >> $GITHUB_ENV
                    echo "pnpm updates are available:"
                    echo "$UPDATES" | jq .
                  else
                    echo "PNPM_UPDATES_AVAILABLE=false" >> $GITHUB_ENV
                    echo "No pnpm updates available"
                  fi

            # Check for a newer uv release if the image exists.
            # uv is copied from ghcr.io/astral-sh/uv:latest at build time and
            # bundles Rust crates (e.g. quinn-proto). Security fixes in those
            # crates only reach us through a new uv release, so we compare the
            # uv version baked into the current image against the latest one.
            - name: Check for uv updates in image
              if: inputs.skip_check == false && env.IMAGE_EXISTS == 'true'
              run: |
                  INSTALLED_UV=$(docker run --rm modelw/base:${{ env.DOCKER_TAG }} uv --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
                  LATEST_UV=$(docker run --rm ghcr.io/astral-sh/uv:latest --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
                  echo "Installed uv: ${INSTALLED_UV:-unknown}"
                  echo "Latest uv:    ${LATEST_UV:-unknown}"
                  if [[ -n "$INSTALLED_UV" && -n "$LATEST_UV" && "$INSTALLED_UV" != "$LATEST_UV" ]]; then
                    echo "UV_UPDATE_AVAILABLE=true" >> $GITHUB_ENV
                    echo "uv update available ($INSTALLED_UV -> $LATEST_UV)"
                  else
                    echo "UV_UPDATE_AVAILABLE=false" >> $GITHUB_ENV
                    echo "uv is up to date"
                  fi

            # Decide whether to proceed with the build
            - name: Decide whether to build
              run: |
                  if [ "${{ inputs.skip_check }}" == "true" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (skip_check is enabled)"
                  elif [ "${{ env.IMAGE_EXISTS }}" == "false" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (image does not exist)"
                  elif [ "${{ env.APT_UPDATES_AVAILABLE }}" == "true" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (apt updates available)"
                  elif [ "${{ env.PYTHON_UPDATE_AVAILABLE }}" == "true" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (Python update available)"
                  elif [ "${{ env.PNPM_UPDATES_AVAILABLE }}" == "true" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (pnpm updates available)"
                  elif [ "${{ env.UV_UPDATE_AVAILABLE }}" == "true" ]; then
                    echo "SHOULD_BUILD=true" >> $GITHUB_ENV
                    echo "Will proceed to build (uv update available)"
                  else
                    echo "SHOULD_BUILD=false" >> $GITHUB_ENV
                    echo "No need to build (image is up to date)"
                  fi

            # Set up QEMU for multi-platform builds
            - name: Set up QEMU
              if: env.SHOULD_BUILD == 'true'
              uses: docker/setup-qemu-action@v3

            # Set up Docker Buildx if we should build
            - name: Set up Docker Buildx
              if: env.SHOULD_BUILD == 'true'
              uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: |
                      image=moby/buildkit:buildx-stable-1
                      network=host

            # Login to Docker Hub if we should build
            - name: Login to Docker Hub
              if: env.SHOULD_BUILD == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            # Build and push the image if we should build
            - name: Build and push
              if: env.SHOULD_BUILD == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: ./image
                  push: true
                  tags: "modelw/base:${{ env.DOCKER_TAG }}"
                  provenance: true
                  sbom: true
                  no-cache: true

            # Indicate if the build was skipped
            - name: Build skipped
              if: env.SHOULD_BUILD == 'false'
              run: echo "Build skipped as the image is up to date"
